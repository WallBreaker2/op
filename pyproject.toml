[project]
name = "op-plugins"
dynamic = ["version"]
description = "Python bindings for OP Windows automation plugin"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
authors = [{ name = "WallBreaker2" }]
keywords = ["automation", "windows", "op", "screen-capture", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/WallBreaker2/op"
Repository = "https://github.com/WallBreaker2/op"
Issues = "https://github.com/WallBreaker2/op/issues"

[build-system]
requires = ["scikit-build-core>=0.10", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[tool.setuptools_scm]
fallback_version = "0.4.8.3"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["python/pyop"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
# §72.51（审计 R-11）：wheel 一直是被构建、被发布，但装好之后从来没被验过 ——
# 没有 test-command，pip wheel / cibuildwheel 都不跑任何东西。历史上出过
# _binding.py 与 op_wrap.cxx 不同步导致 import 直接炸的问题，全靠人肉发现。
# 设了 test-command 之后，构建期会在装好的 wheel 里跑这条 smoke：
# 能 import、能建对象、Ver() 非空 —— 正好覆盖"pyd 与 op_*.dll 能不能加载"
# 这个最容易断的地方。TOML 字面量字符串（单引号）包住，里面可自由写双引号。
test-command = 'python -c "from pyop import Op; print(Op().Ver())"'

[tool.scikit-build.cmake.define]
OP_BUILD_TESTS = "OFF"
OP_PYTHON_WHEEL = "ON"
build_swig_py = "ON"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "pp* *-manylinux* *-musllinux* *-macosx*"
archs = ["AMD64", "x86"]
build-verbosity = 1
